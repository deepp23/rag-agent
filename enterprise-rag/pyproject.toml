[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Enterprise RAG chatbot with hybrid retrieval and LangGraph memory"
requires-python = ">=3.11"
dependencies = [
    # LLM + agent
    "langchain>=0.3",
    "langchain-google-genai>=2.0",
    "langgraph>=0.2",
    "langchain-community>=0.3",

    # Vector DB
    "qdrant-client>=1.9",

    # Sparse retrieval
    "rank-bm25>=0.2",

    # Re-ranking
    "sentence-transformers>=3.0",

    # Document parsing
    "pypdf>=4.0",
    "python-docx>=1.1",
    "unstructured>=0.14",

    # API
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",

    # Config + utils
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv]
package = false